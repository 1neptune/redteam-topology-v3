services:
  atlas:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 默认走阿里云镜像，没写这几项时生效。
        # 注意用的是 ${VAR-default} 而不是 ${VAR:-default}：
        # 前者只在「未定义」时取默认，后者连「定义为空」也会取默认，
        # 那样就没法通过写空值换回官方源了。
        #   .env 里不写        -> 阿里源
        #   .env 里写空值      -> 官方源
        #   .env 里写别的站点  -> 那个站点
        APT_MIRROR: "${APT_MIRROR-mirrors.aliyun.com}"
        NPM_REGISTRY: "${NPM_REGISTRY-https://registry.npmmirror.com}"
        CARGO_MIRROR: "${CARGO_MIRROR-sparse+https://mirrors.aliyun.com/crates.io-index/}"
    image: redteam-atlas:4.5.4
    container_name: redteam-atlas
    restart: unless-stopped
    ports:
      - "${ATLAS_PORT:-8080}:8080"
    environment:
      PORT: 8080
      ATLAS_DATA_DIR: /data
      # 生产必须显式设置：JWT 签名密钥与拓扑加密主密钥
      ATLAS_JWT_SECRET: "${ATLAS_JWT_SECRET:-}"
      ATLAS_SECRET: "${ATLAS_SECRET:-}"
      ATLAS_ADMIN_USER: "${ATLAS_ADMIN_USER:-admin}"
      ATLAS_ADMIN_PASSWORD: "${ATLAS_ADMIN_PASSWORD:-}"
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      # 数据直接落在宿主机磁盘目录：数据库、图标上传、密钥、更新清单
      # 目录由容器入口脚本创建并把属主交给 atlas（uid 1000），无需预先处理
      - /data/atlas:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s